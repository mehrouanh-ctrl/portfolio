<style>
/* ===== VARIABLES : change ici les couleurs et polices ===== */
:root{--ink:#171412;--paper:#fff;--cream:#faf5ef;--rose:#f4d9d0;--coral:#ff5a47;--mut:#7a726b;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--r:32px;--ease:cubic-bezier(.77,0,.18,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:300;color:var(--ink);background:var(--paper);line-height:1.7;overflow-x:hidden}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit;text-decoration:none}
::selection{background:var(--coral);color:#fff}
em{font-style:italic;color:var(--coral)}

/* ===== Rideau de transition & curseur ===== */
.curtain{position:fixed;inset:0;z-index:999;background:var(--rose);display:grid;place-items:center;font:italic 500 clamp(3rem,9vw,6rem) var(--serif);transition:transform .85s var(--ease);pointer-events:none}
.curtain.out{transform:translateY(-100%)}.curtain.pre{transform:translateY(100%);transition:none}
.dot{position:fixed;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--coral);mix-blend-mode:multiply;opacity:0;pointer-events:none;z-index:900;transition:width .3s,height .3s,margin .3s,opacity .3s}
.dot.big{width:64px;height:64px;margin:-23px 0 0 -23px;background:var(--rose)}

/* ===== Menu ===== */
.top{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:20px 4vw;background:rgba(255,255,255,.8);backdrop-filter:blur(16px)}
.brand{font:600 1.7rem var(--serif)}.brand span{color:var(--coral)}
.top nav{display:flex;gap:34px;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;font-weight:400}
.top nav a{position:relative;padding:4px 0}
.top nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--coral);transition:width .4s}
.top nav a:hover::after,.top nav a.on::after{width:100%}

/* ===== Boutons & textes ===== */
.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--coral);font-weight:500;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 30px;border-radius:99px;background:var(--ink);color:#fff;font-size:.85rem;letter-spacing:.06em;font-weight:400;transition:background .35s,transform .35s,box-shadow .35s}
.btn i{font-style:normal;transition:transform .3s}.btn:hover{background:var(--coral);transform:translateY(-3px);box-shadow:0 14px 30px -10px var(--coral)}.btn:hover i{transform:translateX(6px)}
.btn.big{font:500 clamp(1rem,2.4vw,1.6rem) var(--serif);padding:20px 44px}
.link{margin-left:26px;border-bottom:1px solid var(--ink);padding-bottom:2px;font-size:.85rem;transition:color .3s,border-color .3s}.link:hover{color:var(--coral);border-color:var(--coral)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.02;letter-spacing:-.01em}
h2{font-size:clamp(2.4rem,5.5vw,4.6rem)}
.sec{padding:110px 6vw;max-width:1360px;margin:0 auto}.sec>h2{margin-bottom:56px}.narrow{max-width:980px}
.big{font:500 clamp(1.5rem,3vw,2.5rem)/1.35 var(--serif)}

/* ===== Animations d'apparition ===== */
.rv{opacity:0;transform:translateY(46px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:var(--d,0s)}
.rv.on{opacity:1;transform:none}
.tilt.on{transition:opacity 1s,transform .25s ease-out}
.ln{display:block;overflow:hidden;padding-bottom:.08em}.ln>span{display:block;transform:translateY(112%);transition:transform 1.2s var(--ease)}
.ln:nth-child(2)>span{transition-delay:.12s}.ready .ln>span{transform:none}

/* ===== Accueil : hero ===== */
.hero{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:3vw;padding:130px 6vw 70px;background:radial-gradient(circle at 85% 20%,var(--rose),transparent 55%),radial-gradient(circle at 5% 90%,var(--cream),transparent 50%)}
.hero h1{font-size:clamp(4.2rem,11.5vw,10.5rem);margin:6px 0 30px}
.lead{font-size:1.15rem;max-width:520px;color:var(--mut);margin-bottom:38px}
.hero-img{position:relative;height:min(76vh,640px)}
.arch{position:absolute;overflow:hidden;border-radius:999px 999px 28px 28px;box-shadow:0 40px 70px -30px rgba(80,40,30,.35)}
.a1{left:2%;top:6%;width:48%;height:86%}.a2{right:2%;top:0;width:44%;height:68%}
.arch img{transition:transform 1.4s var(--ease)}.arch:hover img{transform:scale(1.08)}
.seal{position:absolute;right:8%;bottom:2%;width:150px;height:150px;background:var(--paper);border-radius:50%;padding:6px;animation:rot 16s linear infinite;box-shadow:0 14px 30px -12px rgba(0,0,0,.25)}
.seal text{font:500 8.4px var(--sans);letter-spacing:.18em;fill:var(--ink)}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== Bandeau défilant ===== */
.marquee{overflow:hidden;background:var(--ink);color:#fff;padding:22px 0;white-space:nowrap}
.marquee div{display:inline-flex;animation:mq 34s linear infinite}
.marquee span{font:italic 500 2.4rem var(--serif);padding:0 28px}.marquee span:nth-child(even){color:var(--coral);font-style:normal}
@keyframes mq{to{transform:translateX(-50%)}}

/* ===== Cartes : photo qui s'efface vers le blanc ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:34px}
.card{border-radius:var(--r);background:#fff;box-shadow:0 30px 70px -34px rgba(60,30,20,.4);overflow:hidden;will-change:transform}
.card:hover{box-shadow:0 40px 80px -30px rgba(255,90,71,.5)}
.photo{position:relative;height:370px;overflow:hidden}
.photo img{transition:transform 1.4s var(--ease)}.card:hover .photo img{transform:scale(1.08)}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 38%,#fff 98%)}
.num{position:absolute;top:20px;left:22px;z-index:2;background:#fff;border-radius:99px;padding:3px 14px;font:600 1rem var(--serif)}
.body{position:relative;z-index:2;padding:0 30px 34px;margin-top:-62px;transform:translateZ(40px)}
.body h3{font-size:2.5rem;margin-bottom:8px}.body p{color:var(--mut);margin-bottom:22px}

/* ===== À propos ===== */
.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:6vw;align-items:center}
.portrait{height:560px;border-radius:999px 999px var(--r) var(--r);overflow:hidden;box-shadow:0 40px 80px -36px rgba(80,40,30,.45)}
.txt{color:var(--mut);margin:26px 0 38px;max-width:560px}
.stats{display:flex;gap:44px;flex-wrap:wrap}.stats b{font:500 3.6rem var(--serif);color:var(--coral);display:block;line-height:1}.stats small{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}

/* ===== Pages de détail ===== */
.dhero{padding:170px 6vw 50px;max-width:1360px;margin:0 auto;background:radial-gradient(circle at 90% 0,var(--rose),transparent 50%)}
.dhero h1{font-size:clamp(3.6rem,11vw,9.5rem);margin-bottom:24px}.back{display:inline-block;margin-bottom:30px;font-size:.82rem;color:var(--mut);transition:color .3s}.back:hover{color:var(--coral)}
.cover{height:70vh;margin:0 4vw;border-radius:var(--r);overflow:hidden;box-shadow:0 40px 80px -40px rgba(80,40,30,.4)}.cover img{height:125%}
.list .row{display:grid;grid-template-columns:70px 1fr 1.3fr;gap:20px;align-items:baseline;padding:30px 0;border-top:1px solid #e8dfd6;transition:padding .45s var(--ease),background .45s}
.list .row:last-child{border-bottom:1px solid #e8dfd6}.row:hover{padding-left:24px;background:linear-gradient(90deg,var(--cream),transparent)}
.row span{color:var(--coral);font:italic 500 1.4rem var(--serif)}.row h3{font-size:2.1rem}.row p{color:var(--mut)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:30px}
.proj div{height:430px;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 60px -34px rgba(60,30,20,.4)}.proj img{transition:transform 1.4s var(--ease)}.proj:hover img{transform:scale(1.08)}
.proj figcaption{padding:18px 6px}.proj h4{font-size:1.8rem}.proj p{color:var(--mut);font-size:.92rem}
.next{display:block;text-align:center;padding:120px 6vw;background:var(--rose);transition:background .5s}.next:hover{background:var(--coral);color:#fff}
.next small{display:block;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px}.next span{font:italic 500 clamp(3rem,9vw,7rem) var(--serif)}

/* ===== Pied de page ===== */
.foot{text-align:center;padding:130px 6vw 40px;background:var(--cream)}
.foot h2{font-size:clamp(3.5rem,10vw,9rem);margin-bottom:40px}.foot h2 span{color:var(--coral)}
.foot-links{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin:50px 0 70px;font-size:.85rem}.foot-links a:hover{color:var(--coral)}
.foot small{color:var(--mut)}

@media(max-width:900px){
.top nav{gap:16px;font-size:.6rem}.brand{display:none}.top{justify-content:center}
.hero,.about{grid-template-columns:1fr}.hero-img{height:460px}.seal{width:110px;height:110px}.portrait{height:440px}
.list .row{grid-template-columns:44px 1fr}.row p{grid-column:2}.dot{display:none}.link{margin-left:14px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

</style>
</head>

const $ = (s, c = document) => c.querySelector(s), $$ = (s, c = document) => [...c.querySelectorAll(s)];
const D = SITE.domaines, ids = Object.keys(D);
const idOf = h => { const m = (h || '').match(/^#\/(\w+)/); return m && D[m[1]] ? m[1] : 'home'; };
let page = idOf(location.hash);
const url = id => id === 'home' ? '#/' : '#/' + id;
const first = SITE.nom.split(' ')[0], last = SITE.nom.split(' ').slice(1).join(' ');

/* ---------- Structure commune ---------- */
const header = () => `<header class="top"><a href="#/" class="brand">${first[0]}<span>.</span>${last}</a>
<nav>${['home', ...ids].map(i => `<a href="${url(i)}" class="${i === page ? 'on' : ''}">${i === 'home' ? 'Accueil' : D[i].titre}</a>`).join('')}</nav></header>`;

const footer = () => `<footer class="foot"><p class="eyebrow rv">Un projet en tête ?</p>
<h2 class="rv">Parlons-en<span>.</span></h2>
<a class="btn big rv" href="mailto:${SITE.email}">${SITE.email}</a>
<div class="foot-links rv"><a href="${SITE.linkedin}" target="_blank" rel="noopener">LinkedIn</a><a href="${SITE.instagram}" target="_blank" rel="noopener">Instagram</a><a href="tel:${SITE.tel.replace(/\s/g, '')}">${SITE.tel}</a></div>
<small>© ${new Date().getFullYear()} ${SITE.nom}</small></footer>`;

const card = (id, i) => `<article class="card tilt rv" style="--d:${i * .12}s"><div class="photo"><img src="${D[id].img}" alt="${D[id].titre}" loading="lazy"><span class="num">0${i + 1}</span></div>
<div class="body"><h3>${D[id].titre}</h3><p>${D[id].accroche}</p><a class="btn" href="${url(id)}">Découvrir <i>→</i></a></div></article>`;

const home = () => `
<section class="hero">
  <div class="hero-txt">
    <p class="eyebrow rv">Portfolio — Événementiel · Marketing · Communication</p>
    <h1><span class="ln"><span>${first}</span></span><span class="ln"><span><em>${last}</em></span></span></h1>
    <p class="lead rv">${SITE.accroche}</p>
    <div class="cta rv"><a class="btn" href="#/" data-scroll="domaines">Découvrir mon travail</a><a class="link" href="mailto:${SITE.email}">Me contacter</a></div>
  </div>
  <div class="hero-img">
    <div class="arch a1" data-speed="-.07"><img src="${D.evenementiel.img}" alt=""></div>
    <div class="arch a2" data-speed=".06"><img src="${D.marketing.img}" alt=""></div>
    <svg class="seal" viewBox="0 0 120 120"><defs><path id="c" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></defs><text><textPath href="#c">ÉVÉNEMENTIEL • MARKETING • COMMUNICATION • </textPath></text></svg>
  </div>
</section>
<div class="marquee"><div>${'<span>Événementiel</span><span>✦</span><span>Marketing</span><span>✦</span><span>Communication</span><span>✦</span>'.repeat(8)}</div></div>
<section class="sec" id="domaines"><p class="eyebrow rv">Mes univers</p><h2 class="rv">Trois façons de<br><em>raconter une histoire</em></h2>
<div class="cards">${ids.map(card).join('')}</div></section>
<section class="sec about"><div class="portrait rv tilt"><img src="${SITE.portrait}" alt="${SITE.nom}"></div>
<div><p class="eyebrow rv">À propos</p><h2 class="rv">${SITE.apropos.titre}</h2><p class="rv txt">${SITE.apropos.texte}</p>
<div class="stats rv">${SITE.apropos.stats.map(s => `<div><b><span data-count="${s[0]}">0</span>${s[1]}</b><small>${s[2]}</small></div>`).join('')}</div></div></section>`;

const detail = id => {
  const d = D[id], next = ids[(ids.indexOf(id) + 1) % ids.length];
  return `
<section class="dhero"><a class="back rv" href="#/">← Accueil</a><p class="eyebrow rv">0${ids.indexOf(id) + 1} — Portfolio</p>
<h1><span class="ln"><span>${d.titre}<em>.</em></span></span></h1><p class="lead rv">${d.accroche}</p></section>
<div class="cover rv"><img data-speed=".05" src="${d.img}" alt="${d.titre}"></div>
<section class="sec narrow"><p class="big rv">${d.intro}</p></section>
<section class="sec"><p class="eyebrow rv">Ce que je fais</p>
<div class="list">${d.services.map((s, i) => `<div class="row rv"><span>0${i + 1}</span><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></section>
<section class="sec"><p class="eyebrow rv">Réalisations</p><h2 class="rv">Projets <em>choisis</em></h2>
<div class="gallery">${d.projets.map((p, i) => `<figure class="proj tilt rv" style="--d:${i * .12}s"><div><img src="${p[2]}" alt="${p[0]}" loading="lazy"></div><figcaption><h4>${p[0]}</h4><p>${p[1]}</p></figcaption></figure>`).join('')}</div></section>
<a class="next" href="${url(next)}"><small>Domaine suivant</small><span>${D[next].titre} →</span></a>`;
};

/* ---------- Rideau de transition + navigation ---------- */
const cur = document.createElement('div'); cur.className = 'curtain'; cur.innerHTML = `<span>${first[0]}.${last[0]}</span>`;
document.body.prepend(cur);
let shown = location.hash, busy = false;
const reveal = () => { cur.classList.add('out'); setTimeout(() => document.body.classList.add('ready'), 250); };
const cover = () => { cur.classList.add('pre'); cur.classList.remove('out'); cur.offsetWidth; cur.classList.remove('pre'); };
function swap() {
  page = idOf(location.hash); shown = location.hash;
  document.body.classList.remove('ready');
  $('#app').innerHTML = header() + `<main>${page === 'home' ? home() : detail(page)}</main>` + footer();
  document.title = page === 'home' ? SITE.nom + ' — Portfolio' : D[page].titre + ' — ' + SITE.nom;
  scrollTo(0, 0); init();
}
function go(h, then) {
  if (busy) return; busy = true; cover();
  setTimeout(() => { if (location.hash !== h) location.hash = h; swap(); reveal(); busy = false; then && setTimeout(then, 900); }, 800);
}
addEventListener('hashchange', () => { if (location.hash !== shown && idOf(location.hash) !== page) go(location.hash); });
document.addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  const h = a.getAttribute('href') || '';
  if (a.dataset.scroll) {
    e.preventDefault(); const t = () => document.getElementById(a.dataset.scroll)?.scrollIntoView({ behavior: 'smooth' });
    page === 'home' ? t() : go('#/', t); return;
  }
  if (h.startsWith('#/')) { e.preventDefault(); idOf(h) === page ? scrollTo({ top: 0, behavior: 'smooth' }) : go(h); }
});

/* ---------- Apparition au scroll, 3D, parallaxe, curseur ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; e.target.classList.add('on');
  const c = $('[data-count]', e.target); if (c) countUp(c); io.unobserve(e.target);
}), { threshold: .12 });
function countUp(el) { const n = +el.dataset.count; let t0; const f = t => { t0 ??= t; const p = Math.min((t - t0) / 1400, 1); el.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); p < 1 && requestAnimationFrame(f); }; requestAnimationFrame(f); }
const fine = matchMedia('(hover:hover)').matches;
const par = () => $$('[data-speed]').forEach(el => el.style.transform = `translateY(${scrollY * el.dataset.speed}px)`);
function init() {
  $$('.rv').forEach(el => io.observe(el));
  $$('.tilt').forEach(el => {
    el.addEventListener('pointermove', e => { if (!fine) return; const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; el.style.transform = `perspective(900px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateY(-6px)`; });
    el.addEventListener('pointerleave', () => el.style.transform = '');
  });
  par();
}
addEventListener('scroll', par, { passive: true });
if (fine) {
  const dot = document.createElement('div'); dot.className = 'dot'; document.body.append(dot);
  let x = 0, y = 0, tx = 0, ty = 0;
  addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; dot.style.opacity = 1; });
  (function loop() { x += (tx - x) * .18; y += (ty - y) * .18; dot.style.transform = `translate(${x}px,${y}px)`; requestAnimationFrame(loop); })();
  document.addEventListener('pointerover', e => dot.classList.toggle('big', !!e.target.closest('a,button,.tilt')));
}
swap();
setTimeout(reveal, 700);   /* sécurité : le rideau s'ouvre toujours, même si une police ou une image tarde */

</script>
